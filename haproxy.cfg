# ═══════════════════════════════════════════════════════════
#  TermChat — répartiteur de charge HAProxy (mode TCP)
#  by Aboudev Labs CI
#
#  - Le TLS n'est PAS ouvert ici : il continue d'être géré par chaque serveur
#    (les certificats cert.pem / key.pem doivent être les mêmes sur tous).
#  - « send-proxy » transmet la vraie IP du client au serveur (étape 4).
#
#  À adapter : les adresses des serveurs (lignes « server »).
# ═══════════════════════════════════════════════════════════
global
    log /dev/log local0
    maxconn 100000

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    # un peu plus que le délai d'inactivité du serveur (TIMEOUT = 1800 s)
    timeout client  35m
    timeout server  35m
    timeout tunnel  35m

frontend termchat_entree
    bind *:9999
    default_backend termchat_serveurs

backend termchat_serveurs
    # « leastconn » : le nouveau client va sur le serveur le moins chargé
    balance leastconn
    default-server inter 5s fall 3 rise 2 maxconn 20000
    server s1 10.0.0.11:9999 check send-proxy
    server s2 10.0.0.12:9999 check send-proxy
